name: sync
# 이슈 알림 구간 계산이 dry-run 실행을 건너뛸 수 있게 제목에 표시한다.
run-name: sync${{ inputs.dryRun && ' (dry-run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 아무것도 쓰지 않고 계획만 출력한다
        type: boolean
        default: true
  schedule:
    - cron: '0 * * * *'

# 이슈 알림 구간을 정하려고 이 workflow 의 실행 기록을 읽는다.
permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F sync sync ${{ inputs.dryRun && '--dry-run' || '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_TEAM: ${{ secrets.SLACK_WEBHOOK_TEAM }}
          SLACK_WEBHOOK_ISSUES: ${{ secrets.SLACK_WEBHOOK_ISSUES }}
